name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/version_contract.py --check
      - run: ruff check .
      - run: mypy src/stackmarshal
      - run: coverage run -m pytest
      - run: coverage report --fail-under=85
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Build verified installer release assets
        if: matrix.python-version == '3.11'
        run: python scripts/build_release.py
      - name: Smoke test one-command installer
        if: matrix.python-version == '3.11'
        run: python scripts/smoke_installer.py
      - run: stackmarshal invocation "Use StackMarshal to build this"
      - run: python skills/stackmarshal/scripts/stackmarshal_core.py invocation "StackMarshalを使って実装して"

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stackmarshal"
version = "1.1.4"
description = "A bounded research-first, capability-discovery, implementation, verification, checkpoint, and resume workflow for Codex."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "StackMarshal contributors" }]
keywords = ["codex", "agent-skills", "research-first", "orchestration", "checkpoint"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "coverage[toml]>=7.6,<8",
  "jsonschema>=4.23,<5",
  "mypy>=1.13,<3",
  "pytest>=8.3,<10",
  "ruff>=0.9,<1",
  "twine>=6,<7",
]

[project.scripts]
stackmarshal = "stackmarshal.cli:main"

[project.urls]
Homepage = "https://github.com/Soph1yzzz/stackmarshal"
Repository = "https://github.com/Soph1yzzz/stackmarshal.git"
Issues = "https://github.com/Soph1yzzz/stackmarshal/issues"
Security = "https://github.com/Soph1yzzz/stackmarshal/security/policy"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stackmarshal = ["data/*.toml", "py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S", "RUF"]
ignore = ["S101", "S105", "S603", "S607", "I001", "E501", "RUF001"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
show_error_codes = true
packages = ["stackmarshal"]
mypy_path = "src"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["stackmarshal"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = false
